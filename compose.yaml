
services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=${ENVIRONMENT}
        - WITH_GPU=${WITH_GPU:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    environment:
      - LOG_LEVEL=debug
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network
  
  
  client-admin:
    build:
      context: ./client-admin
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CLIENT_BASEPATH=${NEXT_PUBLIC_CLIENT_BASEPATH}
        - NEXT_PUBLIC_API_BASEPATH=${NEXT_PUBLIC_API_BASEPATH}
        - NEXT_PUBLIC_ADMIN_API_KEY=${NEXT_PUBLIC_ADMIN_API_KEY}
        - NEXT_PUBLIC_ONETIME_LLM_API_KEY_MODE=${NEXT_PUBLIC_ONETIME_LLM_API_KEY_MODE}
        - CLIENT_STATIC_BUILD_BASEPATH=${CLIENT_STATIC_BUILD_BASEPATH}
        - NEXT_PUBLIC_ONETIME_LLM_API_KEY_MODE=${NEXT_PUBLIC_ONETIME_LLM_API_KEY_MODE}
        - NEXT_PUBLIC_ENVIRONMENT=${ENVIRONMENT} 
    ports:
      - "4000:4000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app-network
      
networks:
  app-network:
    driver: bridge

volumes:
  ollama-data:
    driver: local
